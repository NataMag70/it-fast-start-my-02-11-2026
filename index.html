<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My homework template</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <header> </header>
    <main>
        <section>
            <div class ="container">
                <h1>Проста форма-анкета</h1>
                <form>
                    <fieldset>
                        <legend>Заповніть ваші дані</legend>
                        <p>
                            <label for="firstName">
                                Ваше ім'я:
                            </label>
                            <input 
                                id = "firstName"
                                name="firstName"
                                type="text" 
                                required
                                title="Please enter your first name"
                                placeholder="Введіть своє ім'я"
                            />
                        </p>

                        <p>
                            <label for="lastName">
                                Ваше прізвище:
                            </label>
                            <input 
                                id = "lastName"
                                name="lastName"
                                type="text" 
                                required
                                title="Please enter your last name"
                                placeholder="Введіть своє прізвище"
                            />
                        </p>
                        <p>
                            <label for="email">
                                Електронна пошта:
                            </label>
                            <input 
                                id = "email"
                                name="email"
                                type="email" 
                                required
                                title="Please enter your email"
                                placeholder="Введіть свій email"
                            />
                        </p>
                        <p>
                            <label for="phone">
                                Телефон:
                            </label>
                            <input 
                                id = "phone"
                                name="phone"
                                type="tel" 
                                required
                                title="Please enter your phone number"
                                placeholder="Введіть номер телефону"
                            />
                        </p>
                    </fieldset> 
                    <fieldset>
                        <legend>Дані про ваш курс</legend>
                        <p>
                            <label for="course">
                                Оберіть ваш курс:
                            </label>
                            <select name="course" id="course" required>
                                <option value="none" disabled selected>Оберіть ваш курс</option>
                                <option value="basic">Front-end Basic</option>
                                <option value="pro">Front-end Pro</option>
                                <option value="react">React JS</option>
                                <option value="nade">Node JS</option>
                            </select>
                        </p>
                        <p>
                        <label>
                            <input 
                                type="radio" 
                                name="answer" 
                                id= "yes" 
                                value="yes" 
                                required
                            />
                            <span>Так, виконую</span>
                        </label>
                        <br>
                        <label>
                            <input 
                                type="radio" 
                                name="answer" 
                                id= "no" 
                                value="no" 
                                required
                            />
                            <span>Ні, не встигаю</span>
                        </label>
                        </p>
                        <p>
                        <label>
                            <input 
                                type="checkbox" 
                                name="information" 
                                id= "learn" 
                                value="learn" 
                            />
                            <span>Буду продовжувати навчання</span>
                        </label>
                        <br>
                        <label>
                            <input 
                                type="checkbox" 
                                name="information" 
                                id= "language" 
                                value="language" 
                            />
                            <span>Додатково вивчаю англійську мову</span>
                        </label>
                        </p>
                    </fieldset>
                    <p>
                        <textarea 
                            name="comment" 
                            id="comment" 
                            cols="150" 
                            rows="5" 
                            placeholder="Comment"
                        ></textarea>
                    </p>
                    <button type="submit">Зберегти відповідь</button>
                </form>
            </div>
        </section>
    </main>  
    <footer> </footer> 
</body>
</html>
